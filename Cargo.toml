[workspace]
resolver = "3"
members = ["saus_planner_cli","saus_planner_core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "^0.4.45", features = ["serde"] }
clap = "4.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
